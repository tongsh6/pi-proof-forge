version: "2026-05-21"
mainline: "user_journey_closed_loop"
roadmap: "docs/execution-roadmap.md"
depth_standard: "docs/acceptance-depth.md"
current_focus: "authorized_external_l3_live_run"

vision_alignment:
  source: "PLAN.md"
  product_claim: "Evidence-first job-search engine"
  closed_loop:
    - "raw_materials"
    - "evidence_cards"
    - "explainable_matching"
    - "fact_preserving_resume_generation"
    - "scorecard_gap_feedback"
    - "submission_feedback_iteration"

system_design_alignment:
  constitution: "constitution.md"
  core_spec: "openspec/specs/pi-proof-forge-core.md"
  agent_design: "openspec/changes/autonomous-agent-delivery-loop/design.md"
  gui_design: "ui/design/DESIGN.md"
  gui_pages:
    - "overview"
    - "resumes"
    - "evidence"
    - "jobs"
    - "quick_run"
    - "agent_run"
    - "submissions"
    - "policy"
    - "system_settings"

status_legend:
  - "not_started"
  - "implemented_shallow"
  - "verified_contract"
  - "verified_native"
  - "deep_verified"
  - "blocked"
  - "next"

selection_policy:
  rule: "Pick the first step with status next after all dependencies are deep_verified or verified_native as required."
  wip_limit: 1
  tie_breaker: "journey_order"

steps:
  - id: "system_settings_llm"
    order: 1
    status: "deep_verified"
    journey_stage: "system_settings"
    owner_surface: "ui/src/pages/system-settings/index.tsx"
    user_goal: "Configure local or OpenAI-compatible LLM settings for downstream runs."
    vision_link: "Runtime prerequisite for evidence extraction, matching, generation, and evaluation; not a substitute for the evidence-first pipeline."
    design_refs:
      - "ui/design/DESIGN.md#system-settings"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#3.2-gui-configuration-entry-points"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_first_launch_configure_lm_studio.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_first_launch_configure_lm_studio.py"
        - "tests/unit/gui/test_system_settings_page_contract.py"
        - "tests/unit/sidecar/test_settings_handler.py"
      covers:
        - "provider_defaults"
        - "model_discovery"
        - "detected_model_selection"
        - "save_reload"
        - "masked_secret"
        - "blocked_failure_path"
        - "root_policy_not_modified"
    unlocks:
      - "quick_run_llm_consumption"
      - "agent_run_llm_consumption"

  - id: "resumes_material_library"
    order: 2
    status: "verified_native"
    journey_stage: "resumes"
    owner_surface: "ui/src/pages/resumes/index.tsx"
    user_goal: "Create visible profile and work material sources for evidence extraction."
    vision_link: "Creates raw material inputs for the evidence-first asset layer."
    design_refs:
      - "PLAN.md#5-data-model"
      - "ui/design/DESIGN.md#resumes"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_setup_profile_and_material_library.py -q"
      depth: "native"
      evidence:
        - "tests/acceptance/test_scenario_setup_profile_and_material_library.py"
        - "tests/unit/gui/test_resumes_page_contract.py"
        - "tests/unit/gui/test_evidence_page_contract.py"
      covers:
        - "material_upload_entry"
        - "material_list_visible"
        - "material_readiness"
    unlocks:
      - "evidence_material_sources"

  - id: "evidence_material_sources"
    order: 3
    status: "verified_native"
    journey_stage: "evidence"
    owner_surface: "ui/src/pages/evidence/index.tsx"
    user_goal: "Read material library sources from the Evidence page."
    vision_link: "Connects raw materials to Evidence, but still requires extraction/review before materials become trusted Evidence Cards."
    design_refs:
      - "PLAN.md#4-product-scope"
      - "ui/design/DESIGN.md#evidence"
    depends_on:
      - "resumes_material_library"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_generate_review_and_complete_evidence_card.py -q"
      depth: "native"
      evidence:
        - "tests/acceptance/test_scenario_generate_review_and_complete_evidence_card.py"
        - "tests/unit/gui/test_evidence_page_contract.py"
        - "tests/unit/sidecar/test_evidence_handler.py"
      covers:
        - "material_source_count"
        - "material_source_preview"
    unlocks:
      - "quick_run_material_consumption"

  - id: "quick_run_llm_consumption"
    order: 4
    status: "deep_verified"
    journey_stage: "quick_run"
    owner_surface: "ui/src/pages/quick-run/index.tsx"
    user_goal: "Quick Run consumes the persisted LLM configuration summary."
    vision_link: "Keeps the single-run pipeline connected to configured LLM while preserving the core Evidence -> Matching -> Generation -> Evaluation outputs."
    design_refs:
      - "ui/design/DESIGN.md#quick-run"
      - "openspec/specs/pi-proof-forge-core.md#pipeline-stage-spec"
    depends_on:
      - "system_settings_llm"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_quick_run_generate_and_evaluate_resume.py -q"
      depth: "deep"
      evidence:
        - "outputs/quick_runs/qr_*.json"
        - "outputs/agent_runs/qr_*/summary.json"
      covers:
        - "temp_policy_llm_config"
        - "provider_summary_visible"
        - "model_summary_visible"
        - "masked_secret"
        - "run_context_uses_persisted_config"
    unlocks:
      - "agent_run_llm_consumption"

  - id: "agent_run_llm_consumption"
    order: 5
    status: "deep_verified"
    journey_stage: "agent_run"
    owner_surface: "ui/src/pages/agent-run/index.tsx"
    user_goal: "Agent Run consumes the same persisted LLM configuration summary."
    vision_link: "Aligns autonomous 10-state loop runtime configuration with System Settings before delivery/review automation."
    design_refs:
      - "ui/design/DESIGN.md#agent-run"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#2-state-machine"
    depends_on:
      - "system_settings_llm"
      - "quick_run_llm_consumption"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_agent_run_guided_batch.py -q"
      depth: "deep"
      evidence:
        - "outputs/agent_runs/ar_*.json"
      covers:
        - "provider_summary_visible"
        - "model_summary_visible"
        - "masked_secret"
        - "agent_run_context_uses_persisted_config"

  - id: "quick_run_material_consumption"
    order: 6
    status: "deep_verified"
    journey_stage: "quick_run"
    owner_surface: "ui/src/pages/quick-run/index.tsx"
    user_goal: "Quick Run consumes material-derived evidence and job target inputs."
    vision_link: "Proves the core evidence-first pipeline can consume trusted evidence and job targets to generate traceable resume outputs."
    design_refs:
      - "PLAN.md#6-matching-scoring"
      - "PLAN.md#7-resume-generation"
      - "ui/design/DESIGN.md#quick-run"
    depends_on:
      - "evidence_material_sources"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_quick_run_generate_and_evaluate_resume.py -q"
      depth: "deep"
      evidence:
        - "outputs/quick_runs/qr_*.json"
        - "outputs/agent_runs/qr_*/summary.json"
      covers:
        - "evidence_count_from_material_sources"
        - "selected_job_profile"
        - "traceable_resume_output"

  - id: "evidence_card_extraction_review"
    order: 7
    status: "deep_verified"
    journey_stage: "evidence"
    owner_surface: "ui/src/pages/evidence/index.tsx"
    user_goal: "Turn raw material sources into reviewed Evidence Cards."
    vision_link: "Directly implements the project moat: raw materials -> structured, reviewable, fact-preserving Evidence Cards with results/artifacts gates."
    design_refs:
      - "PLAN.md#5-data-model-core-assets"
      - "openspec/specs/pi-proof-forge-core.md#evidence-card"
      - "ui/design/DESIGN.md#evidence"
    depends_on:
      - "evidence_material_sources"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_generate_review_and_complete_evidence_card.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_generate_review_and_complete_evidence_card.py"
        - "tests/unit/sidecar/test_evidence_handler.py"
        - "outputs/acceptance/acceptance_evidence_review_20260521/journey-report.json"
      covers:
        - "raw_source_traceability"
        - "review_required_before_save"
        - "results_artifacts_gate"
        - "no_fabrication_guard"
    unlocks:
      - "setup_job_target"

  - id: "setup_job_target"
    order: 8
    status: "deep_verified"
    journey_stage: "jobs"
    owner_surface: "ui/src/pages/jobs/index.tsx"
    user_goal: "Create a reviewed job target from pasted JD text for downstream Quick Run and Agent Run selection."
    vision_link: "Creates the explainable matching target that Evidence Cards are scored against before resume generation."
    design_refs:
      - "PLAN.md#6-matching-scoring"
      - "ui/design/DESIGN.md#jobs"
      - "openspec/specs/pi-proof-forge-core.md#job-profile"
    depends_on:
      - "evidence_card_extraction_review"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_setup_job_target.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_setup_job_target.py"
        - "tests/unit/sidecar/test_jobs_handler.py"
        - "outputs/acceptance/acceptance_job_target_20260521/journey-report.json"
      covers:
        - "pasted_jd_to_draft_profile"
        - "review_required_before_save"
        - "incomplete_profile_not_selectable"
        - "complete_profile_visible_to_runs"
        - "job_lead_bidirectional_link"
    unlocks:
      - "quick_run_generate_and_evaluate_resume"

  - id: "quick_run_generate_and_evaluate_resume"
    order: 9
    status: "deep_verified"
    journey_stage: "quick_run"
    owner_surface: "ui/src/pages/quick-run/index.tsx"
    user_goal: "Run matching, resume generation, PDF export, scorecard, and gap feedback for selected eligible evidence and a complete job target."
    vision_link: "Completes the core Evidence Cards -> explainable matching -> fact-preserving resume -> scorecard gap feedback loop for one target."
    design_refs:
      - "PLAN.md#6-matching-scoring"
      - "PLAN.md#7-resume-generation"
      - "ui/design/DESIGN.md#quick-run"
      - "openspec/specs/pi-proof-forge-core.md#pipeline-stage-spec"
    depends_on:
      - "system_settings_llm"
      - "evidence_card_extraction_review"
      - "setup_job_target"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_quick_run_generate_and_evaluate_resume.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_quick_run_generate_and_evaluate_resume.py"
        - "tests/unit/sidecar/test_agent_handler.py"
        - "tests/unit/gui/test_quick_run_page_contract.py"
        - "outputs/quick_runs/qr_*.json"
        - "outputs/agent_runs/qr_*/summary.json"
      covers:
        - "complete_job_profile_selection"
        - "eligible_evidence_selection"
        - "resume_positioning_recorded"
        - "matching_resume_pdf_scorecard_gap_outputs"
        - "fact_preserving_traceability"
    unlocks:
      - "agent_run_guided_batch"

  - id: "agent_run_guided_batch"
    order: 10
    status: "deep_verified"
    journey_stage: "agent_run"
    owner_surface: "ui/src/pages/agent-run/index.tsx"
    user_goal: "Run a guided multi-round batch with gates, review state, and no external submission until approval."
    vision_link: "Extends the verified single-target Quick Run loop into the governed autonomous Agent loop before submission feedback iteration."
    design_refs:
      - "PLAN.md#9-agent-runner"
      - "ui/design/DESIGN.md#agent-run"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#2-state-machine"
    depends_on:
      - "quick_run_generate_and_evaluate_resume"
      - "agent_run_llm_consumption"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_agent_run_guided_batch.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_agent_run_guided_batch.py"
        - "tests/unit/sidecar/test_agent_handler.py"
        - "tests/unit/gui/test_agent_run_page_contract.py"
        - "outputs/agent_runs/ar_*.json"
        - "outputs/review_queue/ar_*.json"
      covers:
        - "multi_round_state_machine_visible"
        - "gate_results_recorded"
        - "review_queue_created"
        - "manual_approval_required_before_delivery"
        - "run_log_traceability"
    unlocks:
      - "channel_session_setup"

  - id: "channel_session_setup"
    order: 11
    status: "deep_verified"
    journey_stage: "submissions"
    owner_surface: "ui/src/pages/submissions/index.tsx"
    user_goal: "Set up a controlled channel browser session for later manual-login submission workflows without storing credentials or submitting."
    vision_link: "Prepares the delivery channel boundary after Agent Run has produced a guarded delivery plan, while preserving no-unattended-submit safety."
    design_refs:
      - "PLAN.md#8-delivery"
      - "ui/design/DESIGN.md#submissions"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#delivery"
    depends_on:
      - "agent_run_guided_batch"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_submission_check_mode.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_channel_session_setup.py"
        - "tests/unit/sidecar/test_submission_handler.py"
        - "tests/unit/gui/test_submissions_page_contract.py"
        - "outputs/channel_sessions/liepin/session.json"
        - "outputs/channel_sessions/liepin/session_check_log.json"
      covers:
        - "channel_session_status_visible"
        - "manual_login_boundary"
        - "no_password_storage"
        - "no_captcha_bypass"
        - "no_resume_submit"
    unlocks:
      - "submission_check_mode"

  - id: "submission_check_mode"
    order: 12
    status: "deep_verified"
    journey_stage: "submissions"
    owner_surface: "ui/src/pages/submissions/index.tsx"
    user_goal: "Run a check-mode submission rehearsal for a supported channel using verified session metadata, a saved Job Lead, and a generated resume PDF without final submit."
    vision_link: "Closes the guarded delivery rehearsal loop by verifying login state, target match, resume path, rate limit, and submit-skipped evidence before any real delivery."
    design_refs:
      - "PLAN.md#8-delivery"
      - "ui/design/DESIGN.md#submissions"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#delivery"
    depends_on:
      - "channel_session_setup"
      - "agent_run_guided_batch"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_submission_check_mode.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_submission_check_mode.py"
        - "tests/unit/sidecar/test_submission_handler.py"
        - "tests/unit/gui/test_submissions_page_contract.py"
        - "outputs/submissions/liepin/sc_*/submission_log.json"
        - "outputs/submissions/liepin/sc_*/submission_log.yaml"
      covers:
        - "channel_session_reused_for_check_mode"
        - "target_and_resume_verified"
        - "rate_limit_recorded"
        - "submit_skipped_recorded"
        - "submission_log_traceability"
    unlocks:
      - "feedback_iteration_after_check_mode"

  - id: "feedback_iteration_after_check_mode"
    order: 13
    status: "deep_verified"
    journey_stage: "feedback_iteration"
    owner_surface: "ui/src/pages/submissions/index.tsx"
    user_goal: "Use check-mode feedback to choose a reviewed iteration action, preserve original artifacts, and route back to evidence, job, or resume workflows."
    vision_link: "Completes the evidence-first loop by turning scorecard gaps, blocked submission reasons, and target recovery outcomes into traceable next-version work."
    design_refs:
      - "PLAN.md#9-feedback-loop"
      - "ui/design/DESIGN.md#submissions"
      - "openspec/specs/pi-proof-forge-core.md#feedback"
    depends_on:
      - "submission_check_mode"
    acceptance:
      script: "python3 -m pytest tests/acceptance/test_scenario_submission_check_mode.py -q"
      depth: "deep"
      evidence:
        - "tests/acceptance/test_scenario_feedback_iteration_after_check_mode.py"
        - "tests/unit/sidecar/test_submission_handler.py"
        - "tests/unit/gui/test_submissions_page_contract.py"
        - "outputs/feedback_iterations/fi_*/iteration_record.json"
        - "outputs/feedback_iterations/fi_*/source_snapshot.json"
      covers:
        - "check_mode_feedback_visible"
        - "iteration_decision_recorded"
        - "original_artifacts_preserved"
        - "route_to_evidence_job_or_resume"
        - "next_check_mode_candidate_linked"
    unlocks:
      - "closed_loop_e2e_audit"

  - id: "closed_loop_e2e_audit"
    order: 14
    status: "deep_verified"
    journey_stage: "full_journey"
    owner_surface: "acceptance/journey_implementation_matrix.yaml"
    user_goal: "Audit the full evidence-first job-search loop from setup through feedback iteration and close remaining traceability or verification gaps."
    vision_link: "Confirms the implemented mainline now forms one coherent loop rather than isolated page-level capabilities."
    design_refs:
      - "PLAN.md"
      - "constitution.md"
      - "docs/acceptance-depth.md"
      - "acceptance/journey_contract.yaml"
    depends_on:
      - "feedback_iteration_after_check_mode"
    acceptance:
      script: "bash scripts/acceptance/run-acceptance.sh --run-id acceptance_closed_loop --level L1"
      depth: "deep"
      evidence:
        - "tools/acceptance/acceptance_runner.py"
        - "tools/acceptance/external_l3.py"
        - "tests/acceptance/test_acceptance_runner.py"
        - "outputs/acceptance/acceptance_closed_loop_20260522/closed-loop-audit.json"
        - "outputs/acceptance/acceptance_closed_loop_20260522/acceptance-report.json"
        - "outputs/acceptance/acceptance_closed_loop_20260522/journey-report.json"
        - "outputs/quick_runs/qr_*.json"
        - "outputs/agent_runs/ar_*.json"
        - "outputs/submissions/liepin/sc_*/submission_log.json"
        - "outputs/feedback_iterations/fi_*/iteration_record.json"
      covers:
        - "all_l1_scenarios_in_runner"
        - "journey_report_all_mainline_rules_pass"
        - "native_evidence_for_deep_steps_present"
        - "traceability_paths_connect_across_stages"
    unlocks:
      - "external_l3_submission_validation"

  - id: "external_l3_submission_validation"
    order: 15
    status: "deep_verified"
    journey_stage: "external_delivery"
    owner_surface: "tools/submission/liepin.py"
    user_goal: "在用户显式授权下，对真实外部渠道验证受控投递闭环，或记录精确 live blocker。"
    vision_link: "把已验证的本地/check-mode 闭环推进到真实世界投递边界，同时保留显式确认、频控、目标校验和无 secret 持久化。"
    design_refs:
      - "PLAN.md#8-delivery"
      - "constitution.md"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#delivery"
      - "docs/acceptance-depth.md"
    depends_on:
      - "closed_loop_e2e_audit"
    acceptance:
      script: "bash scripts/acceptance/run-acceptance.sh --run-id acceptance_external_l3 --level L3"
      depth: "deep"
      evidence:
        - "tools/acceptance/acceptance_runner.py"
        - "tools/acceptance/external_l3.py"
        - "tests/acceptance/test_acceptance_runner.py"
        - "outputs/acceptance/acceptance_external_l3/external-l3-validation.json"
        - "outputs/acceptance/acceptance_external_l3/external-l3-validation.md"
        - "outputs/acceptance/acceptance_external_l3/journey-report.json"
      covers:
        - "user_authorized_external_session"
        - "explicit_final_submit_gate"
        - "live_channel_result_or_blocker_recorded"
        - "post_submit_feedback_traceability"
        - "no_secret_or_captcha_bypass"
    unlocks:
      - "external_l3_authorization_handoff"

  - id: "external_l3_authorization_handoff"
    order: 16
    status: "deep_verified"
    journey_stage: "external_delivery"
    owner_surface: "tools/acceptance/external_l3.py"
    user_goal: "把 External L3 blocker 转成可执行的授权交接包，让下一次真实渠道验证有明确输入、确认项和禁止项。"
    vision_link: "把 live blocker 从单纯失败记录转为可审计的下一步操作，继续保持显式授权、最终提交门禁和 no-secret/captcha 边界。"
    design_refs:
      - "acceptance/journey_contract.yaml"
      - "docs/acceptance-depth.md"
      - "constitution.md"
    depends_on:
      - "external_l3_submission_validation"
    acceptance:
      script: "bash scripts/acceptance/run-acceptance.sh --run-id acceptance_external_l3 --level L3"
      depth: "deep"
      evidence:
        - "tools/acceptance/external_l3.py"
        - "tests/acceptance/test_acceptance_runner.py"
        - "outputs/acceptance/acceptance_external_l3/external-l3-validation.json"
        - "outputs/acceptance/acceptance_external_l3/external-l3-validation.md"
      covers:
        - "operator_handoff_created"
        - "required_env_presence_without_values"
        - "final_submit_checklist_recorded"
        - "forbidden_secret_and_challenge_inputs_recorded"
        - "next_authorized_run_command_template_recorded"
    unlocks:
      - "authorized_external_l3_live_run"

  - id: "authorized_external_l3_live_run"
    order: 17
    status: "next"
    journey_stage: "external_delivery"
    owner_surface: "tools/submission/liepin.py"
    user_goal: "在用户显式授权并单独确认最终提交后，执行一次真实外部渠道 L3 验证或记录真实渠道 blocker。"
    vision_link: "把已准备好的授权交接包推进到真实世界渠道结果，同时仍保留频控、target verify、最终提交门禁和反馈追溯。"
    design_refs:
      - "PLAN.md#8-delivery"
      - "acceptance/journey_contract.yaml"
      - "docs/acceptance-depth.md"
      - "openspec/changes/autonomous-agent-delivery-loop/design.md#delivery"
    depends_on:
      - "external_l3_authorization_handoff"
    acceptance:
      script: "bash scripts/acceptance/run-acceptance.sh --run-id acceptance_external_l3 --level L3"
      depth: "deep_required"
      evidence:
        - "outputs/acceptance/acceptance_external_l3/external-l3-validation.json"
        - "outputs/submissions/liepin/*/submission_log.yaml"
      covers:
        - "explicit_user_authorized_live_run"
        - "separate_final_submit_confirmed"
        - "real_channel_result_or_live_blocker"
        - "submission_log_linked_to_l3_validation"
        - "post_submit_or_blocker_feedback_traceability"
