version: "2026-05-22"
source_scenario_cases: "acceptance/scenario_cases.yaml"
status: "ready_for_implementation"
purpose: "Machine-readable journey contract derived from approved scenario cases."

journey:
  stages:
    - "overview"
    - "resumes"
    - "evidence"
    - "jobs"
    - "quick_run"
    - "agent_run"
    - "submissions"
    - "policy"
    - "system_settings"

levels:
  L1:
    name: "Scenario Data/API Validation"
    status: "not_started"
  L2:
    name: "User Visible Scenario"
    status: "not_started"
  L3:
    name: "Local/External Integration"
    status: "not_started"

selected_cases:
  - "first_launch_configure_lm_studio"
  - "setup_profile_and_material_library"
  - "generate_review_and_complete_evidence_card"
  - "setup_job_target"
  - "quick_run_generate_and_evaluate_resume"
  - "agent_run_guided_batch"
  - "channel_session_setup"
  - "submission_check_mode"
  - "feedback_iteration_after_check_mode"
  - "external_l3_submission_validation"

case_contracts:
  first_launch_configure_lm_studio:
    primary_stage: "system_settings"
    supporting_stages:
      - "quick_run"
      - "agent_run"
    required_outputs:
      - "provider_config_saved"
      - "connection_test_structured_result"
      - "quick_run_provider_summary"
      - "agent_run_provider_summary"
    acceptance_rules:
      - rule_id: "lm_studio_config_persisted"
        level: "L1"
        stage: "system_settings"
        status: "not_started"
        evidence: ""
        message: "LM Studio provider/base_url/api_key/model can be saved and read without exposing raw secrets."
      - rule_id: "lm_studio_connection_check_structured"
        level: "L1"
        stage: "system_settings"
        status: "not_started"
        evidence: ""
        message: "LM Studio connection check returns pass or a structured local-provider blocked result."
      - rule_id: "lm_studio_visible_to_run_pages"
        level: "L2"
        stage: "quick_run"
        status: "not_started"
        evidence: ""
        message: "Quick Run and Agent Run show the saved provider summary."

  setup_profile_and_material_library:
    primary_stage: "resumes"
    supporting_stages:
      - "evidence"
    required_outputs:
      - "personal_profile_saved"
      - "uploaded_resume_metadata"
      - "raw_material_library_entries"
      - "material_readiness_feedback"
    acceptance_rules:
      - rule_id: "profile_and_materials_persisted"
        level: "L1"
        stage: "resumes"
        status: "not_started"
        evidence: ""
        message: "Profile, uploaded resume metadata, and text materials are persisted as reusable inputs."

  generate_review_and_complete_evidence_card:
    primary_stage: "evidence"
    supporting_stages:
      - "resumes"
    required_outputs:
      - "evidence_card_draft"
      - "user_review_decision"
      - "saved_evidence_card"
      - "fabrication_guard_result"
    acceptance_rules:
      - rule_id: "evidence_card_requires_review"
        level: "L1"
        stage: "evidence"
        status: "not_started"
        evidence: ""
        message: "LLM-drafted evidence must be reviewed and remain linked to raw material before save."

  setup_job_target:
    primary_stage: "jobs"
    supporting_stages:
      - "quick_run"
      - "agent_run"
    required_outputs:
      - "job_profile_saved"
      - "job_lead_saved"
      - "source_url_validation_result"
      - "job_target_readiness_summary"
    acceptance_rules:
      - rule_id: "job_target_ready_for_runs"
        level: "L1"
        stage: "jobs"
        status: "not_started"
        evidence: ""
        message: "A reviewed job target and linked job lead can be read by Quick Run and Agent Run."

  quick_run_generate_and_evaluate_resume:
    primary_stage: "quick_run"
    supporting_stages:
      - "evidence"
      - "jobs"
      - "resumes"
    required_outputs:
      - "matching_report"
      - "generated_resume_markdown"
      - "generated_resume_pdf"
      - "evaluation_scorecard"
      - "gap_tasks"
    acceptance_rules:
      - rule_id: "quick_run_outputs_are_traceable"
        level: "L1"
        stage: "quick_run"
        status: "not_started"
        evidence: ""
        message: "Generated resume artifacts link back to matching report, evidence cards, job target, scorecard, and gap tasks."

  agent_run_guided_batch:
    primary_stage: "agent_run"
    supporting_stages:
      - "quick_run"
      - "submissions"
      - "policy"
    required_outputs:
      - "agent_run_log"
      - "review_decisions"
      - "selected_candidates"
      - "generated_artifacts_for_passed_candidates"
      - "no_real_submit_record"
    acceptance_rules:
      - rule_id: "agent_run_batch_is_guarded"
        level: "L1"
        stage: "agent_run"
        status: "not_started"
        evidence: ""
        message: "Batch run records candidate decisions and generated artifacts without real submit."

  channel_session_setup:
    primary_stage: "system_settings"
    supporting_stages:
      - "submissions"
    required_outputs:
      - "channel_session_status"
      - "session_metadata"
      - "safe_account_identity_or_unknown"
      - "session_check_log"
    acceptance_rules:
      - rule_id: "channel_session_validity_is_positive_signal_based"
        level: "L1"
        stage: "system_settings"
        status: "not_started"
        evidence: ""
        message: "A valid session requires a positive login signal and never stores credentials or bypasses captcha/SMS."

  submission_check_mode:
    primary_stage: "submissions"
    supporting_stages:
      - "agent_run"
      - "system_settings"
      - "policy"
    required_outputs:
      - "submission_log"
      - "submission_steps"
      - "selected_channel_session_metadata"
      - "original_job_lead"
      - "final_verified_target"
      - "submit_skipped_status"
    acceptance_rules:
      - rule_id: "check_mode_never_final_submits"
        level: "L1"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "Check-mode records rate limit, login, target verification, attachment/check result, and submit_skipped without final submit."

  feedback_iteration_after_check_mode:
    primary_stage: "submissions"
    supporting_stages:
      - "evidence"
      - "jobs"
      - "resumes"
      - "quick_run"
      - "agent_run"
    required_outputs:
      - "feedback_iteration_record"
      - "source_feedback_snapshot"
      - "selected_iteration_actions"
      - "version_comparison_summary"
      - "next_check_mode_candidate"
    acceptance_rules:
      - rule_id: "feedback_iteration_preserves_traceability"
        level: "L1"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "Feedback iteration preserves source artifacts, selected actions, previous version, new version when created, and next check-mode link."

  external_l3_submission_validation:
    primary_stage: "submissions"
    supporting_stages:
      - "system_settings"
      - "policy"
    required_outputs:
      - "external_l3_validation_record"
      - "live_channel_result_or_blocker"
      - "final_submit_gate_result"
      - "bidirectional_submission_log_trace"
      - "no_secret_or_captcha_bypass_evidence"
    acceptance_rules:
      - rule_id: "external_l3_result_or_blocker_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录受控真实渠道结果或精确 live blocker，并保留显式授权、最终提交门禁以及无 secret/captcha 绕过证据；顶层报告消息必须区分 submit 命令未启动的 pre-submit blocker 与命令后产生的 post-command blocker。"
      - rule_id: "external_l3_submit_safety_decision_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录最终提交安全决策，证明 submit 命令只会在显式授权、独立最终确认和真实输入齐备后被允许；如果产生 live blocker，submit safety 中的 blocking_reason 或 post_run_blocker_reason 必须与 live_blocker.reason 一致。"
      - rule_id: "external_l3_live_input_artifacts_fingerprinted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录真实输入产物的非内容型审计摘要，让真实渠道结果可回溯到具体 resume/profile 版本。"
      - rule_id: "external_l3_input_artifact_basenames_redacted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须保证 validation record 与关联 submission log 不持久化 resume/profile 文件名，只记录扩展名、大小、SHA256 和 basename_persisted=false。"
      - rule_id: "external_l3_human_readable_redaction_evidence_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在 Markdown 报告中展示输入产物文件名/原内容未持久化；如果执行真实渠道命令，还必须展示 submission log 的文件名与浏览器产物脱敏结论，让操作者无需深挖 JSON 也能审计安全边界。"
      - rule_id: "external_l3_rate_limit_policy_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录真实 submit 的频控策略，并在频控被关闭时阻断在 submit 命令启动前。"
      - rule_id: "external_l3_forbidden_inputs_rejected"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须审计并拒绝密码、验证码、短信码和原始密钥类 forbidden inputs；如果出现，必须在 submit 命令启动前记录 blocker，且不持久化原值。"
      - rule_id: "external_l3_target_confirmation_matches_url"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在 submit 命令启动前审计 Job URL 中的岗位 ID 是否可解析且与确认岗位 ID 一致；不一致时必须记录 blocker，且不持久化原始确认值。确认 recruiter 的预检只证明已提供且不持久化原值，页面招聘方一致性必须由 target_verify 证明。"
      - rule_id: "external_l3_live_command_redacted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须保证 validation record 中持久化的真实渠道命令已脱敏，不写入 Job URL、文件路径或确认值原文。"
      - rule_id: "external_l3_live_output_redacted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须保证 validation record 中持久化的 stdout/stderr 尾部同样套用 live 输入脱敏策略，不写入 Job URL、文件路径或确认值原文。"
      - rule_id: "external_l3_post_submit_feedback_traceable"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须把真实渠道结果或 live blocker 转成可追溯的提交后反馈来源和下一步处理路径；blocker 场景中的 feedback source_reason 必须与 live_blocker.reason 一致；Markdown 报告必须展示与 JSON 一致的反馈来源状态、来源原因和下一步。"
      - rule_id: "external_l3_post_command_blocker_diagnostics_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在真实渠道命令执行后产生 blocker 时，把 returncode、submission log 路径、traceability failed checks 和成功投递关键步骤摘要直接记录到 live blocker，并在 Markdown 报告同步展示同一组诊断；如果 submission log error 可解析且属于已知渠道业务失败，包括 batch_cooldown/daily_limit_exceeded 频控错误和 main_chat_click_failed/send_resume_click_failed/confirm_send_button_not_found 等真实发简历链路错误，即使命令 returncode 为 0，journey report 也必须验证 blocker reason 使用精确 external_channel_* 归因，而不是只记录通用非零退出码或泛化业务失败。"
      - rule_id: "external_l3_submission_log_summary_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在 submission log 可解析时，把 status、error、mode 和已脱敏的 last step 摘要提升到 validation、Markdown 与 live blocker 诊断；Markdown 必须同步展示 traceability failed_checks 与逐项 checks 表；如果 last step detail 包含未脱敏 target_verify 观测值或 HTML snapshot 描述，validation 摘要必须改写为脱敏占位而不是复制原文。"
      - rule_id: "external_l3_submission_log_path_guarded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收只能读取预期输出根目录下的 submission log；命令输出指向允许根目录外时必须记录 traceability blocker，不能读取相邻 JSON 或链接为成功证据；Markdown 报告必须同步展示允许根目录、路径边界结论和拒绝原因，且不得泄露被拒绝的原始越界路径。"
      - rule_id: "external_l3_submission_log_required_steps_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在成功投递的 submission log 中证明 rate_limit、login_check、target_verify、submit_safety、chat_send_resume 和 submit 关键步骤均已记录且通过，并在 Markdown 报告同步展示必需步骤、已记录步骤、缺失步骤和失败步骤；缺失时必须转为 traceability blocker。只有 submission log status=success 才能计为 external_validated；returncode 为 0 但 log status 不是 success 时必须记录业务 blocker。"
      - rule_id: "external_l3_submission_log_raw_inputs_redacted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须保证关联 submission log 声明 live_inputs_redacted=true，原始 Job URL、resume/profile 路径字段已脱敏，并且 input_artifacts.job_url.raw_value_persisted=false，只保留非内容型指纹用于追溯。"
      - rule_id: "external_l3_submission_log_step_details_redacted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须保证关联 submission log 的 steps.detail 不持久化 Job URL、resume/profile 路径、确认岗位 ID、确认 recruiter 或页面读取到的岗位/招聘方原文。"
      - rule_id: "external_l3_submission_log_browser_artifacts_redacted"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须保证提交器在 External L3 模式下不捕获或引用原始浏览器截图、HTML snapshot；SubmissionRecorder 必须在记录层忽略 screenshot 引用，真实渠道诊断只能保留结构化 blocker 与脱敏摘要。"
      - rule_id: "external_l3_authorization_packet_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录结构化授权确认包，包含必需确认声明、证据清单、中止条件、脱敏策略和禁止输入项，且不持久化原始确认值。"
      - rule_id: "external_l3_handoff_command_template_matches_effective_policy"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 授权交接包必须记录当前运行配置；命令模板必须使用 shell-safe 的 live 输入占位符，并与当前 channel、session/output 目录、timeout/headless 和有效频控策略保持一致；Markdown 报告必须展示可复制命令模板，避免下一次真实运行复制过期默认值或被 shell 误解析。"
      - rule_id: "external_l3_handoff_command_template_review_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 授权交接包必须记录命令模板复核结论，证明模板不可盲贴执行；替换 live 输入占位符、显式授权和独立最终提交确认完成前，Markdown 报告必须保持 copy_paste_ready=false。"
      - rule_id: "external_l3_evidence_manifest_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录统一证据清单，覆盖 validation JSON/Markdown、关键嵌入段、live blocker 或 submission log、feedback source，并证明清单不持久化原始 live 输入；Markdown 清单必须逐项同步 JSON 中的位置、必需性、存在状态和状态值。"
      - rule_id: "external_l3_outcome_summary_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须记录结果分级，明确 acceptance pass 只代表证据写出与规则通过，并区分 pre-submit blocker、post-command blocker 和真实外部验证成功；P0-017 未真实成功时必须保持 p0_017_complete=false；blocker 场景中的 next_action 必须与 live_blocker.next_action 一致，Markdown 报告中的 outcome、blocker reason 和 next action 必须与 JSON 一致。"
      - rule_id: "external_l3_manual_session_ready_confirmed_before_command"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在 submit 命令启动前记录人工会话准备 gate；共享渠道 session 未经人工登录或刷新确认可用时，必须阻断在真实渠道命令启动前，且不得接收或持久化密码、验证码或短信码。"
      - rule_id: "external_l3_pre_submit_blocker_diagnostics_recorded"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须在 submit 命令启动前产生 blocker 时，把 missing gates、readiness gates 和真实输入审计摘要直接记录到 live blocker；Markdown 报告必须同步展示 submit 是否允许启动、missing gates 和输入审计摘要，避免操作者只能深挖 JSON 才能理解阻断原因。"
      - rule_id: "external_l3_timeout_recorded_as_live_blocker"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须把真实渠道命令超时记录为精确 live blocker，保留 timeout 秒数、脱敏输出尾部和后续处理路径；Markdown 报告必须同步展示 timeout blocker 原因、超时状态和 timeout 秒数。"
      - rule_id: "external_l3_command_error_recorded_as_live_blocker"
        level: "L3"
        stage: "submissions"
        status: "not_started"
        evidence: ""
        message: "External L3 验收必须把真实渠道命令启动错误记录为精确 live blocker，保留脱敏错误类型/信息和后续处理路径；Markdown 报告必须同步展示错误类型和脱敏错误信息，不得泄露 Job URL 或本地文件路径。"
