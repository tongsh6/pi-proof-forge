  - design.md
  - tasks.md
  - specs/llm-provider-config/spec.md
notes: |
  来源：2026-10-21 用户请求「添加strata provider」。本机 Strata 桌面应用
  （strata-engine）通过 OpenAI 兼容接口提供本地推理：
  - 端点默认 http://127.0.0.1:8081/v1，/models 返回当前加载模型；
  - 当前模型 qwen3.8-flash-next-q2_0；
  - 本地回环默认无鉴权，serving API Key 为可选项；
  - 思考控制走请求顶层 reasoning_effort（none / low / medium / high），
    不是 DeepSeek 风格的 thinking 对象。
  本变更不改变 P0-026 唯一 next，不新增平台写入，不改变当前生效 provider。
