title: 以简历文体定义高质量标准，并让证据卡时间/角色可由带出处推断补齐
status: proposed
owner: pi-proof-forge team
created_at: 2026-10-17
updated_at: 2026-10-17
relates_to: P0-026（简历质量修复部分）
artifacts:
  - proposal.md
  - design.md
