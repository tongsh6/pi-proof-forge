[package]
name = "piproofforge"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 记忆窗口尺寸与位置（保存在应用数据目录的 .window-state.json），桌面端常规体验。
tauri-plugin-window-state = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
